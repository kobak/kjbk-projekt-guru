name: GURU mobile
on:
  pull_request:
    paths: ['ios/**', 'core/**', 'frontend/**', 'config/**', 'macos/Sources/Protocol.swift', 'requirements.lock', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    name: Simulator (${{ matrix.family }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Boot simulator while installing dependencies
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          device=$(xcrun simctl list devices available -j | python -c '
          import json, os, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: tuple(map(int, r.split(".iOS-")[1].split("-"))), reverse=True)
          print(next(d["udid"] for r in ios for d in runtimes[r] if d["name"].startswith(os.environ["FAMILY"])))')
          xcrun simctl boot "$device"
          echo "GURU_SIMULATOR=$device" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Test workspace and notification tap
        env:
          GURU_TEST_PYTHON: python
        run: |
          xcrun simctl bootstatus "$GURU_SIMULATOR" -b
          sh ios/test-simulator.sh "$GURU_SIMULATOR"
