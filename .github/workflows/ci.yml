name: Tests and Docker smoke test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_url: ''
          - database: postgres
            database_url: postgresql://kozos:ci-only-password@127.0.0.1:54320/kozos
          - database: mariadb
            database_url: mysql://root:ci-only-password@127.0.0.1:33060/kozos
    services:
      # Ezek eldobható CI-adatok, nem telepítési hitelesítő adatok.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kozos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kozos
        ports: ['54320:5432']
        options: >-
          --health-cmd "pg_isready -U kozos -d kozos"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: kozos
        ports: ['33060:3306']
        options: >-
          --health-cmd "mariadb-admin ping -h127.0.0.1 -pci-only-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DEBUG: 'true'
      SECRET_KEY: ci-only-not-for-production
      APP_URL: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: ${{ matrix.database_url }}
      NOTIFICATION_EMAIL_ENABLED: 'false'
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - if: matrix.database == 'mariadb'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
          python -m pip install -r requirements-mariadb.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core --noinput
      - run: git diff --check

  docker:
    name: Docker install and backup restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build from source
        run: docker build --tag kozos:local .
      - name: Generate isolated environment
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/app" \
            --entrypoint python kozos:local scripts/configure.py --url https://localhost
          docker compose config --quiet
      - name: Start and check
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8094/health/
          docker compose exec -T app python manage.py shell -c 'from core.models import Workspace; from pathlib import Path; Workspace.objects.create(id=1, name="backup-smoke"); Path("media/smoke.txt").write_text("backup-smoke")'
      - name: Backup and restore into a separate database
        run: |
          sh scripts/backup.sh
          backup_path=$(find backups -mindepth 1 -maxdepth 1 -type d)
          test -f "$backup_path/COMPLETE"
          cmp .env "$backup_path/environment.env"
          tar -xOzf "$backup_path/attachments.tar.gz" ./smoke.txt | grep -qx backup-smoke
          tar -tzf "$backup_path/source.tar.gz" >/dev/null
          docker compose exec -T db createdb -U kozos kozos_restore
          docker compose exec -T db pg_restore -U kozos -d kozos_restore --no-owner --exit-on-error < "$backup_path/database.dump"
          test "$(docker compose exec -T db psql -U kozos -d kozos_restore -tAc "SELECT name FROM core_workspace WHERE id=1")" = backup-smoke
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8094/health/
      - name: Diagnostics
        if: failure() && hashFiles('.env') != ''
        run: docker compose logs --tail=120 app worker db
      - name: Clean isolated volumes
        if: always() && hashFiles('.env') != ''
        run: docker compose down -v --remove-orphans
