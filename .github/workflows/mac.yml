name: Mac app
on:
  push:
    branches: [main]
    tags: ['v*', 'mac-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    name: Universal Mac build and protocol tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh macos/test.sh
      - run: python3 macos/build.py
      - run: codesign --verify --deep --strict 'macos/build/kjbk projekt guru.app'
      - run: lipo 'macos/build/kjbk projekt guru.app/Contents/MacOS/Guru' -verify_arch arm64 x86_64
      - run: git diff --check
