name: kozos
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kozos
      POSTGRES_USER: kozos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Futtasd a scripts/configure.py programot}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kozos -d kozos"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      options: {max-size: "10m", max-file: "3"}
  app:
    build: .
    image: kozos:local
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql://kozos:${POSTGRES_PASSWORD}@db:5432/kozos
    ports:
      - "127.0.0.1:8094:8000"
    volumes:
      - attachments:/app/media
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=4)"]
      interval: 30s
      timeout: 6s
      start_period: 40s
      retries: 3
    logging:
      options: {max-size: "10m", max-file: "3"}
  worker:
    image: kozos:local
    command: ["python", "manage.py", "runworker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql://kozos:${POSTGRES_PASSWORD}@db:5432/kozos
    volumes:
      - attachments:/app/media
    depends_on:
      app: {condition: service_healthy}
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  database:
  attachments:
